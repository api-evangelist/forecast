name: forecast
description: >-
  Forecast is an AI-powered project and resource management platform (a
  professional services automation / PSA tool) for project-driven companies,
  covering predictive project planning, resource allocation, capacity planning,
  time tracking, budgets, rate cards, and financial forecasting. Forecast
  exposes a complete REST API (JSON over HTTPS at api.forecast.it) for projects,
  tasks, time registrations, allocations, people, clients, and webhooks,
  authenticated with a per-integration API key. Originally a Danish/UK startup
  backed by Balderton Capital, Forecast was acquired by Accelo in 2025 and the
  forecast.app brand has since been integrated into accelo.com, while the
  api.forecast.it API endpoints remain operational. Added to the API Evangelist
  network from a VC-portfolio lead and enriched from the public Forecast API
  documentation.
